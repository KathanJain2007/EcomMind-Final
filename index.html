<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EcomMind – Autonomous Economy. An AI agent that discovers, negotiates with and pays other agents for your e-commerce business." />
    <title>EcomMind – Autonomous Economy</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Holds a white page until IntroSplash takes over, so the dark theme can't flash first.
      try {
        if (!sessionStorage.getItem('ecommind-intro-played') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          var boot = document.createElement('div')
          boot.id = 'intro-boot'
          boot.style.cssText = 'position:fixed;inset:0;z-index:100;background:#fff'
          document.body.appendChild(boot)
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
